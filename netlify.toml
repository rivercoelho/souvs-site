[build]
  publish = "."
  functions = "netlify/functions"

# pretty profile links: www.souvs.shop/<username> serves the SPA (200 rewrite,
# browser URL stays). Non-forced, so real files (qr.min.js, manifest, …) win.
[[redirects]]
  from = "/:username"
  to = "/.netlify/functions/username-router?u=:username"
  status = 200
  # only real profile usernames resolve; everything else gets a 404 (SEO)
